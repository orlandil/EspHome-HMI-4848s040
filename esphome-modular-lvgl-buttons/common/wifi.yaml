---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  on_connect:
    - delay: 5s

  # IP statico (opzionale): togli il commento e adatta alla tua rete
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

  # Hotspot di emergenza (captive portal) se il Wi-Fi non si connette
  ap:
    ssid: "HMI Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
